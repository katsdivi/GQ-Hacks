<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Before v4 (not v4): the v3 lead-lag question; the Polymarket US lag was a cache">
<title>Before v4 (not v4): the v3 lead-lag question; the Polymarket US lag was a cache</title>
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#21262d" stroke-width="1"/>
  </pattern>
  <linearGradient id="edge" x1="0" x2="1">
    <stop offset="0" stop-color="#e040fb"/><stop offset="1" stop-color="#00e5ff"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
.sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
.ink { fill: #e6edf3; } .ink2 { fill: #9da7b3; } .ink3 { fill: #6e7681; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
@keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

.trace { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1;
          animation: draw 3.2s cubic-bezier(.6,.05,.3,1) .3s both; }
.td { animation: pulse 1.6s ease-in-out 1.6s infinite both; }
.late { animation: fadeUp .7s ease-out 1.2s both; }
.head { animation: fadeUp .8s ease-out .1s both; }
.cursor { animation: blink 1s steps(1) infinite; }
</style>
<rect x="1" y="1" width="1198" height="438" rx="16" fill="#0d1117" stroke="#30363d"/>
<rect x="1" y="1" width="1198" height="438" rx="16" fill="url(#grid)" opacity=".55"/>
<rect x="24" y="1" width="1152" height="2" fill="url(#edge)" opacity=".9"/>

<g class="head">
  <text x="44" y="58" font-size="15" fill="#00e5ff">$ staleline v3 --venues kalshi,polymarket.com,polymarket_us   # before v4</text>
  <rect class="cursor" x="826" y="45" width="9" height="17" fill="#00e5ff"/>
  <text x="44" y="88" font-size="13" class="ink3">v3 lead-lag study (not v4): P(home team wins) around one touchdown · schematic, not data</text>
</g>
<g font-size="13">
  <line x1="90" y1="358" x2="1110" y2="358" stroke="#30363d"/>
  <text x="90" y="380" class="ink3">time →</text>
  <text x="80" y="172" text-anchor="end" class="ink3">58%</text>
  <text x="80" y="324" text-anchor="end" class="ink3">42%</text>
</g>
<g class="td">
  <line x1="520" y1="120" x2="520" y2="358" stroke="#e040fb" stroke-width="2" stroke-dasharray="4 5"/>
  <text x="520" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#e040fb">🏈 TOUCHDOWN</text>
</g>
