<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Before v4 (not v4): the v1 to v3 bet, test and verdict">
<title>Before v4 (not v4): the v1 to v3 bet, test and verdict</title>
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#21262d" stroke-width="1"/>
  </pattern>
  <linearGradient id="edge" x1="0" x2="1">
    <stop offset="0" stop-color="#e040fb"/><stop offset="1" stop-color="#00e5ff"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
.sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
.ink { fill: #e6edf3; } .ink2 { fill: #9da7b3; } .ink3 { fill: #6e7681; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
@keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
.card { animation: fadeUp .8s cubic-bezier(.2,.7,.2,1) both; }</style>
<rect x="1" y="1" width="1198" height="328" rx="16" fill="#0d1117" stroke="#30363d"/>
<rect x="1" y="1" width="1198" height="328" rx="16" fill="url(#grid)" opacity=".55"/>
<rect x="24" y="1" width="1152" height="2" fill="url(#edge)" opacity=".9"/>

<g class="card" style="animation-delay:0.15s">
  <rect x="32" y="34" width="360" height="262" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="32" y="34" width="360" height="4" rx="2" fill="#e040fb"/>
  <text x="60" y="96" font-size="40" font-weight="800" fill="#e040fb" filter="url(#glow)">01</text>
  <text x="132" y="92" font-size="18" font-weight="700" letter-spacing="3" class="ink">v3 BET</text>
  <g transform="translate(332,62)" stroke="#e040fb" fill="#e040fb"><path d="M14 0 L2 22 H12 L8 40 L22 14 H12 Z" fill="none" stroke-width="2.5" stroke-linejoin="round"/></g>
  <line x1="60" y1="124" x2="364" y2="124" stroke="#30363d"/>
  <text x="60" y="170" font-size="17" class="ink sans">A touchdown happens.</text><text x="60" y="200" font-size="17" class="ink sans">One venue reprices first.</text><text x="60" y="230" font-size="17" class="ink sans">If another lags by seconds,</text><text x="60" y="260" font-size="17" class="ink sans">buy its stale price.</text>
</g>
<g class="card" style="animation-delay:0.60s">
  <rect x="416" y="34" width="360" height="262" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="416" y="34" width="360" height="4" rx="2" fill="#ffb86b"/>
  <text x="444" y="96" font-size="40" font-weight="800" fill="#ffb86b" filter="url(#glow)">02</text>
  <text x="516" y="92" font-size="18" font-weight="700" letter-spacing="3" class="ink">v3 TEST</text>
  <g transform="translate(716,62)" stroke="#ffb86b" fill="#ffb86b"><rect x="2" y="16" width="26" height="22" rx="4" fill="none" stroke-width="2.5"/><path d="M8 16 V10 a7 7 0 0 1 14 0 V16" fill="none" stroke-width="2.5"/><circle cx="15" cy="27" r="3"/></g>
  <line x1="444" y1="124" x2="748" y2="124" stroke="#30363d"/>
  <text x="444" y="170" font-size="17" class="ink sans">Record 3 venues live.</text><text x="444" y="200" font-size="17" class="ink sans">Freeze every rule in git.</text><text x="444" y="230" font-size="17" class="ink sans">Tune on games before Aug 1.</text><text x="444" y="260" font-size="17" class="ink sans">Open the sealed holdout once.</text>
</g>
<g class="card" style="animation-delay:1.05s">
  <rect x="800" y="34" width="360" height="262" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="800" y="34" width="360" height="4" rx="2" fill="#00e5ff"/>
  <text x="828" y="96" font-size="40" font-weight="800" fill="#00e5ff" filter="url(#glow)">03</text>
  <text x="900" y="92" font-size="18" font-weight="700" letter-spacing="3" class="ink">v3 VERDICT</text>
  <g transform="translate(1100,62)" stroke="#00e5ff" fill="#00e5ff"><circle cx="15" cy="15" r="12" fill="none" stroke-width="2.5"/><path d="M24 24 L36 36" stroke-width="3" stroke-linecap="round"/><path d="M9 15 L14 20 L22 10" fill="none" stroke-width="2.5"/></g>
  <line x1="828" y1="124" x2="1132" y2="124" stroke="#30363d"/>
  <text x="828" y="170" font-size="17" class="ink sans">Kalshi = polymarket.com (0.0 s).</text><text x="828" y="200" font-size="17" class="ink sans">Polymarket US 'lag' = a cache.</text><text x="828" y="230" font-size="17" class="ink sans">Every v3 strategy lost after fees.</text><text x="828" y="260" font-size="17" class="ink sans">566 trials. No real edge.</text>
</g>
</svg>
