<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 202" width="1200" height="202" role="img" aria-label="Before v4 (not v4): v1 to v3 headline numbers">
<title>Before v4 (not v4): v1 to v3 headline numbers</title>
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#21262d" stroke-width="1"/>
  </pattern>
  <linearGradient id="edge" x1="0" x2="1">
    <stop offset="0" stop-color="#e040fb"/><stop offset="1" stop-color="#00e5ff"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
.sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
.ink { fill: #e6edf3; } .ink2 { fill: #9da7b3; } .ink3 { fill: #6e7681; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
@keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
.tile { animation: fadeUp .6s ease-out both; }</style>
<rect x="1" y="1" width="1198" height="200" rx="16" fill="#0d1117" stroke="#30363d"/>
<rect x="1" y="1" width="1198" height="200" rx="16" fill="url(#grid)" opacity=".55"/>
<rect x="24" y="1" width="1152" height="2" fill="url(#edge)" opacity=".9"/>

<g class="tile" style="animation-delay:0.10s">
